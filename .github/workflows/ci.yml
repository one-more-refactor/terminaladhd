name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      # --all-targets so the tests and benches are linted too, not just the
      # library — that is where the drift usually hides.
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
